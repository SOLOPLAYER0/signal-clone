<svg width="680" height="550" viewBox="0 0 680 550" xmlns="http://www.w3.org/2000/svg" role="img">
<title>High-level architecture of the Signal clone</title>
<desc>A Next.js client on Vercel talks to a single FastAPI server on Render over HTTPS REST and a WSS WebSocket. The server contains REST endpoint routers and a WebSocket manager, and reads/writes a SQLite database via SQLAlchemy ORM.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="550" fill="#ffffff"/>

<!-- Client -->
<rect x="190" y="40" width="300" height="100" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="78" text-anchor="middle" fill="#26215C">Next.js client</text>
<text class="ts" x="340" y="100" text-anchor="middle" fill="#3C3489">Browser, hosted on Vercel</text>

<!-- Client -> Server arrows -->
<line x1="300" y1="140" x2="300" y2="220" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="308" y="184" fill="#3d3d3a">HTTPS</text>
<text class="ts" x="308" y="198" fill="#3d3d3a">REST</text>
<line x1="380" y1="140" x2="380" y2="220" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="388" y="184" fill="#3d3d3a">WSS</text>
<text class="ts" x="388" y="198" fill="#3d3d3a">socket</text>

<!-- Server container -->
<rect x="140" y="220" width="400" height="180" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="250" text-anchor="middle" fill="#04342C">FastAPI server</text>
<text class="ts" x="340" y="270" text-anchor="middle" fill="#085041">Single process, hosted on Render</text>

<!-- REST endpoints region -->
<rect x="160" y="290" width="170" height="80" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="245" y="320" text-anchor="middle" fill="#042C53">REST endpoints</text>
<text class="ts" x="245" y="342" text-anchor="middle" fill="#0C447C">Auth & messaging</text>

<!-- WS manager region -->
<rect x="350" y="290" width="170" height="80" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="435" y="320" text-anchor="middle" fill="#412402">WS manager</text>
<text class="ts" x="435" y="342" text-anchor="middle" fill="#633806">Presence, typing</text>

<!-- Server -> DB arrow -->
<line x1="340" y1="400" x2="340" y2="440" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="350" y="424" fill="#3d3d3a">SQLAlchemy</text>

<!-- Database -->
<rect x="240" y="440" width="200" height="70" rx="14" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="340" y="470" text-anchor="middle" fill="#4A1B0C">SQLite database</text>
<text class="ts" x="340" y="492" text-anchor="middle" fill="#712B13">Single file</text>
</svg>
